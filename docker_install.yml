---
- name: Install Docker via Ansible
  hosts: all
  gather_facts: true
  become: true

  vars:
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

    conflicting_packages:
      - podman
      - buildah
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-engine
      - runc

  tasks:
# --------------------------- For RHEL Based Systems ---------------------------------- #
    - name: Docker Installation for AlmaLinux, RedHat, and Rocky Linux
      when: ansible_os_family == "RedHat"
      block:

        - name: Remove conflicting packages
          ansible.builtin.dnf:
            name: "{{ conflicting_packages }}"
            state: absent

        - name: Install dnf plugins
          ansible.builtin.dnf:
            name: dnf-plugins-core
            state: present

        - name: Add Docker repository for RHEL
          ansible.builtin.yum_repository:
            name: docker-ce
            description: Docker CE Repository - RHEL
            baseurl: https://download.docker.com/linux/rhel/$releasever/$basearch/stable
            enabled: true
            gpgkey: https://download.docker.com/linux/rhel/gpg
            gpgcheck: true
          when: ansible_distribution == "RedHat"

        - name: Add Docker repository for Rocky Linux 
          ansible.builtin.yum_repository:
            name: docker-ce
            description: Docker CE Repository - RHEL
            baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
            enabled: true
            gpgkey: https://download.docker.com/linux/centos/gpg
            gpgcheck: true
          when: ansible_distribution in ['Rocky', 'AlmaLinux', 'CentOS']

        - name: Install Docker packages
          ansible.builtin.dnf:
            name: "{{ docker_packages }}"
            state: present

        - name: Enable and start Docker
          ansible.builtin.service:
            name: docker
            state: started
            enabled: true

# --------------------------- For Debian Based Systems ---------------------------------- #
    - name: Docker Script for Ubuntu / Debian
      when: ansible_os_family == "Debian"
      block:

        - name: Update apt cache
          ansible.builtin.apt:
            update_cache: true

        - name: Install dependencies
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg
            state: present

        - name: Create keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download Docker GPG key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Add Docker repository
          ansible.builtin.apt_repository:
            repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present
            filename: docker

        - name: Install Docker packages
          ansible.builtin.apt:
            name: "{{ docker_packages }}"
            state: present
            update_cache: true

        - name: Enable and start Docker
          ansible.builtin.service:
            name: docker
            state: started
            enabled: true

        - name: Add ubuntu user to docker group
          ansible.builtin.user:
            name: ubuntu
            groups: docker
            append: true
            state: present
...